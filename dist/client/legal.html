<!doctype html><html lang="uz"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Huquqiy ma’lumot — Goclean.uz</title><link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin><link href="https://fonts.googleapis.com/css2?family=Manrope:wght@400;500;600;700;800&display=swap" rel="stylesheet"><link rel="stylesheet" href="styles.css?v=18"><link rel="icon" href="favicon.svg" type="image/svg+xml"><script src="seo-runtime.js?v=1" defer></script></head><body><div data-site-header></div><main><section class="page-hero"><div class="container"><div class="breadcrumbs"><a href="index.html">Bosh sahifa</a><span>→</span><b id="crumbTitle">Huquqiy ma’lumot</b></div><span class="kicker">Goclean.uz</span><h1 id="legalTitle"></h1></div></section><section class="detail-content"><article class="container legal-copy" id="legalCopy"></article></section></main><div data-site-footer></div><script src="shared.js?v=15"></script><script>const privacy=new URLSearchParams(location.search).get('doc')==='privacy';const title=privacy?'Maxfiylik siyosati':'Foydalanish shartlari';document.title=title+' — Goclean.uz';document.querySelector('#legalTitle').textContent=title;document.querySelector('#crumbTitle').textContent=title;document.querySelector('#legalCopy').innerHTML=privacy?`<h2>Ma’lumotlarni qayta ishlash</h2><p>Ism, telefon va ixtiyoriy kiritilgan tozalash maydoni arizani qabul qilish uchun xavfsiz server orqali Goclean menejerlariga yuboriladi. Bot tokeni brauzerda saqlanmaydi.</p><h2>Foydalanish maqsadi</h2><p>Kontakt ma’lumotlari arizaga javob berish, xizmat tafsilotlarini kelishish va sifat nazorati uchun ishlatiladi.</p><h2>Google Analytics va cookie-fayllar</h2><p>Saytdan foydalanish statistikasi, sahifa ko‘rishlari va saytdagi o‘zaro aloqalarni tahlil qilish uchun Google Analytics ishlatiladi. Google ushbu ma’lumotlarni o‘z siyosatiga muvofiq qayta ishlaydi. Brauzer sozlamalari orqali cookie-fayllarni cheklashingiz mumkin.</p><p>Google ma’lumotlardan qanday foydalanishi haqida <a href="https://policies.google.com/technologies/partner-sites" target="_blank" rel="noopener">Google hamkor saytlar siyosati</a>da batafsil ma’lumot mavjud.</p>`:`<h2>Xizmat shartlari</h2><p>Saytdagi ariza hali tasdiqlangan buyurtma hisoblanmaydi. Xizmat tarkibi, manzil, vaqt, to‘lov va yakuniy narx operator bilan suhbatda kelishiladi.</p><h2>Buyurtma va bekor qilish</h2><p>Buyurtma operator bilan tafsilotlar kelishilib, tasdiqlangandan so‘ng kuchga kiradi. Bekor qilish va vaqtni o‘zgartirish shartlari tasdiqlash vaqtida kelishiladi.</p>`;</script></body></html>
