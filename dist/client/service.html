sh va buyurtma</a><a class="text-link" href="contact.html">Savolim bor →</a></aside></div></section><section class="section process compact"><div class="container"><div class="section-heading centered"><span class="kicker">Jarayon</span><h2>Qanday ishlaydi?</h2></div><div class="steps"><article><span>1</span><div class="step-icon">▤</div><h3>Parametrlarni kiriting</h3><p>Obyekt, hajm va qo‘shimcha xizmatlarni tanlang.</p></article><article><span>2</span><div class="step-icon">♙</div><h3>Vaqtni belgilang</h3><p>Manzil va o‘zingizga qulay sanani kiriting.</p></article><article><span>3</span><div class="step-icon">✓</div><h3>Buyurtmani tasdiqlang</h3><p>Jami narxni ko‘rib, to‘lov usulini tanlang.</p></article></div></div></section>`;</script></body></html>
