<!doctype html><html lang="uz"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Kirish — Goclean.uz</title><link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin><link href="https://fonts.googleapis.com/css2?family=Manrope:wght@400;500;600;700;800&display=swap" rel="stylesheet"><link rel="stylesheet" href="styles.css"></head><body><div data-site-header></div><main class="auth-main"><div class="auth-card"><a class="brand" href="index.html"><span class="brand-mark"><svg viewBox="0 0 48 48"><path d="M14 30c9 0 16-7 16-16 7 6 10 13 7 20-3 7-12 11-20 8-5-2-8-6-9-11 2 0 4-1 6-1Z"/></svg></span><span>Go<span>clean</span><small>.uz</small></span></a><div id="phoneStage"><span class="kicker">Shaxsiy kabinet</span><h1>Telefon orqali kirish</h1><p>Tasdiqlash kodi yuboriladigan telefon raqamingizni kiriting.</p><label>Telefon<input id="loginPhone" type="tel" placeholder="+998 90 123 45 67"></label><button class="primary-button full" id="sendCode">Kodni yuborish →</button></div><div id="codeStage" hidden><span class="kicker">Tasdiqlash</span><h1>SMS kodni kiriting</h1><p>Prototip rejimi: sinov kodi <b>1234</b>.</p><label>4 xonali kod<input id="otp" inputmode="numeric" maxlength="4" placeholder="••••"></label><button class="primary-button full" id="verifyCode">Tasdiqlash →</button><button class="text-button" id="changePhone">Raqamni o‘zgartirish</button></div><div id="accountStage" hidden><div class="modal-icon">✓</div><h1>Kabinetga kirdingiz</h1><p>Ushbu brauzerda saqlangan buyurtmalaringiz:</p><div id="orderHistory" class="order-history"></div><a class="primary-button full" href="booking.html">Yangi buyurtma</a></div></div></main><script src="shared.js?v=4"></script><script>const p=document.querySelector('#phoneStage'),c=document.querySelector('#codeStage'),a=document.querySelector('#accountStage');document.querySelector('#sendCode').onclick=()=>{if(!document.querySelector('#loginPhone').value.trim())return alert('Telefon raqamini kiriting');p.hidden=true;c.hidden=false};document.querySelector('#changePhone').onclick=()=>{c.hidden=true;p.hidden=false};document.querySelector('#verifyCode').onclick=()=>{if(document.querySelector('#otp').value!=='1234')return alert('Sinov kodi: 1234');c.hidden=true;a.hidden=false;const orders=JSON.parse(localStorage.getItem('gocleanOrders')||'[]');document.querySelector('#orderHistory').innerHTML=orders.length?orders.map(o=>`<div><b>${o.id}</b><span>${o.date} · ${o.time}</span><strong>${new Intl.NumberFormat('uz-UZ').format(o.total)} so‘m</strong></div>`).join(''):'<p>Hozircha buyurtmalar yo‘q.</p>'}</script></body></html>
