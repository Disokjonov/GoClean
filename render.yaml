services:
  - type: web
    name: goclean-uz
    runtime: static
    branch: main
    autoDeploy: true
    buildCommand: npm run build
    staticPublishPath: ./dist/client
    headers:
      - path: /*
        name: X-Content-Type-Options
        value: nosniff
      - path: /*
        name: Referrer-Policy
        value: strict-origin-when-cross-origin
      - path: /*
        name: X-Frame-Options
        value: SAMEORIGIN
      - path: /public/assets/*
        name: Cache-Control
        value: public, max-age=31536000, immutable
