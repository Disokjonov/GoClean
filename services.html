<!doctype html><html lang="uz"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Xizmatlar — Goclean.uz</title><link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin><link href="https://fonts.googleapis.com/css2?family=Manrope:wght@400;500;600;700;800&display=swap" rel="stylesheet"><link rel="stylesheet" href="styles.css"></head><body><div data-site-header></div><main><section class="page-hero compact-page-hero"><div class="container"><div class="breadcrumbs"><a href="index.html">Bosh sahifa</a><span>→</span><b>Xizmatlar</b></div><span class="kicker">Go Clean katalogi</span><h1>Barcha tozalash xizmatlari</h1><p>Uy, ofis va maxsus obyektlar uchun kerakli xizmatni tanlang.</p></div></section><section class="catalog-section"><div class="container"><div class="filter-bar"><button class="active" data-filter="all">Barchasi</button><button data-filter="home">Uy uchun</button><button data-filter="dry">Kimyoviy tozalash</button><button data-filter="business">Biznes uchun</button><button data-filter="special">Maxsus xizmatlar</button></div><div class="catalog-grid" id="catalogGrid"></div></div></section></main><div data-site-footer></div><script src="data.js?v=3"></script><script src="shared.js?v=3"></script><script>
const grid=document.querySelector('#catalogGrid');
function render(f='all'){grid.innerHTML=GOCLEAN_SERVICES.filter(s=>f==='all'||s.category===f).map(s=>`<article class="catalog-card"><a class="catalog-image" href="service.html?slug=${s.slug}"><picture><source media="(max-width:560px)" srcset="public/assets/services/${s.image.replace('.png','-mobile.png')}"><img src="public/assets/services/${s.image}" alt="${s.name}" loading="lazy" decoding="async"></picture><span>${s.icon}</span></a><div class="catalog-card-body"><h3><a href="service.html?slug=${s.slug}">${s.name}</a></h3><p>${s.summary}</p><div class="catalog-price"><strong>${s.price}</strong><small>${s.unit}</small></div><div class="catalog-actions"><a class="detail-cta" href="service.html?slug=${s.slug}">Batafsil ko‘rish</a><a class="mini-order" href="booking.html?service=${s.slug}">Buyurtma berish</a></div></div></article>`).join('')}
render();document.querySelectorAll('[data-filter]').forEach(b=>b.onclick=()=>{document.querySelectorAll('[data-filter]').forEach(x=>x.classList.remove('active'));b.classList.add('active');render(b.dataset.filter)});
</script></body></html>
